<body class="bg-stone-50 text-stone-900 min-h-screen">

  <header class="border-b border-stone-200 bg-white sticky top-0 z-10">

      <div class="col-span-full text-center text-stone-400 py-20">Loading catalog...</div>

  <footer class="border-t border-stone-200 mt-16">
